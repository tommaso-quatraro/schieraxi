version: 2
# Dependabot propone le versioni nuove delle azioni di GitHub con una PR alla settimana, tutte insieme. Le sue PR non si uniscono
# da sole (il job «unisci» esclude dependabot[bot] e vale solo per le PR del proprietario) e non chiedono fanta/novita.d.
# Azioni: nei workflow sono fissate per SHA (con la versione in commento); Dependabot aggiorna SHA e commento insieme.
# cooldown: una versione nuova si propone solo dopo 7 giorni dall'uscita (se è guasta o malevola, nel frattempo si scopre).
#
# Librerie Python (pip): NON qui. Con requirements.in accanto, Dependabot tratta requirements.txt come uscita di pip-compile e lo
# rigenera con pip-compile, non con script/blocca_dipendenze.py: perderebbe le versioni per Python < 3.12
# (requirements-vincoli.in) e le dipendenze di tutte le piattaforme. Si aggiornano a mano con lo script (--aggiorna).
# Gli avvisi di sicurezza sulle librerie (Dependabot alerts) restano: si accendono da Settings > Code security.
updates:
  - package-ecosystem: github-actions
    directory: "/"              # legge tutti i file in .github/workflows/
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    groups:
      azioni:
        patterns: ["*"]
