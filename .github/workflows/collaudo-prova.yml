name: Collaudo della prova

# Collaudo automatico dell'ambiente di prova dopo ogni rilascio (issue #511, piano dell'ondata 2, lavoro C2).
# Ogni 20 minuti guarda se la prova (prova.<dominio>) ha l'ultima release del server v<N> non ancora collaudata; se sì entra con
# l'account di collaudo, apre le schermate principali a 390 e 1440 px, chiaro e scuro, e controlla errori della console (comprese
# le risposte 4xx e 5xx), scorrimento di lato e accessibilità (axe), con prove/foto_web/foto.py --solo-misure: nessuna foto.
# - Una versione collaudata (bene o male, purché le misure siano partite) lascia l'artifact «collaudo-v<N>» (solo esito.txt,
#   senza indirizzi, 30 giorni): le corse ogni 20 minuti la saltano per 20 ore, poi la collaudano di nuovo. Se le misure non
#   partono (prova spenta, Playwright che non si installa) l'artifact non c'è e la corsa dopo riprova. A mano (Actions >
#   Collaudo della prova > Run workflow) si collauda subito, anche se già collaudata.
# - GitHub fa partire di rado le corse «ogni 20 minuti»: la corsa fissa delle 5:17 UTC (poco affollata) collauda sempre la
#   versione in vigore sulla prova, anche se collaudata da poco (decidi --quotidiano): almeno un collaudo al giorno anche
#   senza versione nuova (issue #549).
# - Collaudo che non passa: issue P1 «Collaudo della prova: v<N> non passa», una sola per versione (un collaudo ripetuto la
#   commenta) e corsa ROSSA. Collaudo che passa: chiude le issue del collaudo ancora aperte.
# - La prova senza la versione nuova oltre 40 minuti dopo la release: issue «La prova non si aggiorna» e corsa rossa; si chiude
#   da sola quando la prova ha la versione nuova.
# - Senza i segreti PROVA_URL, PROVA_UTENTE e PROVA_PASSWORD non fa niente e resta verde.
# Sicurezza: i segreti solo come variabili d'ambiente, solo nei due job che parlano con la prova; mai sulla riga di comando né
# stampati (GitHub li maschera comunque nel registro). Nessun evento pull_request: i segreti non arrivano a codice di altri.
# Permessi di sola lettura; il permesso sulle issue solo nel job che segnala, che non vede i segreti. I testi delle issue sono senza
# indirizzi (il repository è pubblico).
on:
  schedule:
    - cron: "4,24,44 * * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

# un giro alla volta: una corsa lenta non si sovrappone alla successiva e non si aprono issue doppie
concurrency:
  group: collaudo-prova
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  decidi:
    name: Serve un collaudo?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # elenco delle release
      actions: read    # artifact «collaudo-v<N>» delle corse precedenti
    outputs:
      esito: ${{ steps.decidi.outputs.esito }}
      versione: ${{ steps.decidi.outputs.versione }}
      prova: ${{ steps.decidi.outputs.prova }}
      minuti: ${{ steps.decidi.outputs.minuti }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: script/ci
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - id: decidi
        env:
          PROVA_URL: ${{ secrets.PROVA_URL }}
          PROVA_UTENTE: ${{ secrets.PROVA_UTENTE }}
          PROVA_PASSWORD: ${{ secrets.PROVA_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          PIANO: ${{ github.event.schedule }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            python -I script/ci/collaudo_prova.py decidi --forza
          elif [ "$PIANO" = "17 5 * * *" ]; then
            python -I script/ci/collaudo_prova.py decidi --quotidiano
          else
            python -I script/ci/collaudo_prova.py decidi
          fi

  collauda:
    name: Collaudo delle schermate
    needs: decidi
    if: needs.decidi.outputs.esito == 'collauda'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.esito.outputs.ok }}
      dettaglio: ${{ steps.esito.outputs.dettaglio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            prove/foto_web
            script/ci
            tests/strumenti/axe
            .github/playwright-requisiti.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # ambiente a parte, come «Aspetto della web»; Chrome è quello già installato sui computer di GitHub
      - name: Playwright (versioni e hash fissati)
        run: |
          python -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/python" -m pip install -q --require-hashes --only-binary=:all: -r .github/playwright-requisiti.txt
      # esce con 1 o 2 se trova difetti: decide il passo dopo, dal riepilogo
      - name: Schermate della prova (solo misure, nessuna foto)
        continue-on-error: true
        env:
          PROVA_URL: ${{ secrets.PROVA_URL }}
          SCHIERAXI_UTENTE: ${{ secrets.PROVA_UTENTE }}
          SCHIERAXI_PASSWORD: ${{ secrets.PROVA_PASSWORD }}
        run: >-
          "$RUNNER_TEMP/pw/bin/python" -I -s prove/foto_web/foto.py "$PROVA_URL" "$RUNNER_TEMP/collaudo"
          --accesso --solo-misure --larghezze 390,1440 --temi chiaro,scuro
          --scene oggi,formazione,squadra,rosa,scheda,altro,diario,regole,impostazioni
      - id: esito
        name: Esito dal riepilogo
        if: ${{ !cancelled() }}
        env:
          PROVA_URL: ${{ secrets.PROVA_URL }}
        run: python -I script/ci/collaudo_prova.py esito "$RUNNER_TEMP/collaudo"
      # il segno «versione collaudata», solo se le misure sono partite (c'è riepilogo.txt): altrimenti la corsa dopo riprova.
      # Dentro solo esito.txt, già senza indirizzi: riepilogo.txt può avere l'indirizzo della prova negli errori di Playwright,
      # e gli artifact di un repository pubblico li scarica chiunque. Nessuna immagine.
      - name: Segno della versione collaudata
        if: ${{ !cancelled() && steps.esito.outputs.fatto == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: collaudo-v${{ needs.decidi.outputs.versione }}
          path: |
            ${{ runner.temp }}/collaudo/esito.txt
          if-no-files-found: warn
          retention-days: 30

  segnala:
    name: Apre o chiude le issue
    needs: [decidi, collauda]
    # se la decisione stessa si rompe non si accusa nessuno: il job «decidi» resta rosso e si vede in Actions
    if: >-
      ${{ always() && needs.decidi.result == 'success'
      && needs.decidi.outputs.esito != 'spento' && needs.decidi.outputs.esito != 'aspetta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # solo per lo script che scrive le issue
      issues: write   # solo per aprire, commentare e chiudere le issue del collaudo e del ritardo
    env:
      DECISIONE: ${{ needs.decidi.outputs.esito }}
      VERSIONE: ${{ needs.decidi.outputs.versione }}
      PROVA: ${{ needs.decidi.outputs.prova }}
      MINUTI: ${{ needs.decidi.outputs.minuti }}
      OK: ${{ needs.collauda.outputs.ok }}
      DETTAGLIO: ${{ needs.collauda.outputs.dettaglio }}
    steps:
      # solo lo script (nessun segreto in questo job): i testi delle issue e la regola «una sola issue per versione» stanno
      # in script/ci/collaudo_prova.py, comando «segnala», con i loro test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: script/ci
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Apre, aggiorna o chiude le issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -I script/ci/collaudo_prova.py segnala
      # il comando «giornata» del coordinatore conta come fallita ogni corsa che non finisce con success, skipped o cancelled
      - name: Corsa rossa se il collaudo non passa o la prova non si aggiorna
        run: |
          if [ "$OK" = "false" ] || [ "$DECISIONE" = "in-ritardo" ]; then
            echo "Collaudo della prova: esito «$DECISIONE», collaudo ok=${OK:-non fatto}. Dettagli nell'issue aperta o commentata."
            exit 1
          fi
