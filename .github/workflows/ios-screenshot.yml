name: iOS foto

# Fotografa l'app (e, se servono, i widget) nel simulatore di un Mac di GitHub, in modalità demo (-DEMO: dati finti, nessuna rete).
# Portato dal repository iOS di prima (cartella ios/). Il Mac parte SOLO:
# - a mano (Actions o `gh workflow run ios-screenshot.yml --ref <ramo>`, con le stesse scelte di prima);
# - su una pull request con l'etichetta «screenshot», o che cambia le schermate (ios/Sources/Presentation, Support, App) o i widget.
# Su una pull request si fotografano le schermate scritte nella descrizione in una riga «Schermate: a b c» (in tutte le varianti:
# iPhone chiaro, scuro e testo grande, iPad verticale e orizzontale); senza la riga, il giro veloce.
# Le foto stanno negli artifact «screenshot-app» e «screenshot-widget» (14 giorni). Nessun segreto, nessuna release.
on:
  workflow_dispatch:
    inputs:
      scatti:
        description: "veloce = solo le schermate principali; completo = tutte le varianti (quasi un'ora)"
        type: choice
        options: [veloce, completo, collaudo]
        default: veloce
      iphone:
        description: "quale iPhone: predefinito (Pro), piccolo (SE o il più stretto), grande (Pro Max)"
        type: choice
        options: [predefinito, piccolo, grande]
        default: predefinito
      dispositivi:
        description: "quali giri: tutti, solo iphone, solo ipad"
        type: choice
        options: [tutti, iphone, ipad]
        default: tutti
      schermate:
        description: "solo queste schermate (nomi separati da spazi), in tutte le varianti; vuoto = secondo «scatti»"
        type: string
        default: ""
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths: ["ios/**", ".github/workflows/ios-screenshot.yml"]

concurrency:
  group: ios-foto-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scatti }}-${{ inputs.iphone }}-${{ inputs.dispositivi }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Su Linux (gratis, pochi secondi): decide se serve il Mac e quali schermate fotografare.
  quando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      serve: ${{ steps.decidi.outputs.serve }}
      widget: ${{ steps.decidi.outputs.widget }}
      schermate: ${{ steps.decidi.outputs.schermate }}
    steps:
      - name: Serve il Mac?
        id: decidi
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ETICHETTE: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          NUMERO: ${{ github.event.pull_request.number }}
          DESCRIZIONE: ${{ github.event.pull_request.body }}
          SCHERMATE_A_MANO: ${{ inputs.schermate }}
        run: |
          serve=false; widget=false; schermate=""
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            serve=true; widget=true; schermate="$SCHERMATE_A_MANO"
          elif [ "$EVENTO" = "pull_request" ]; then
            file="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMERO/files" --jq '.[].filename')"
            case ",$ETICHETTE," in *,screenshot,*) serve=true ;; esac
            if printf '%s\n' "$file" | grep -Eq '^ios/(Sources/(Presentation|Support|App)/|scripts/screenshot)'; then serve=true; fi
            if printf '%s\n' "$file" | grep -Eq '^ios/(WidgetSources|AnteprimaWidget)/'; then serve=true; widget=true; fi
            # «Schermate: a b c» nella descrizione: solo lettere minuscole, cifre, trattini e spazi (niente altro arriva alla shell)
            schermate="$(printf '%s\n' "$DESCRIZIONE" | grep -m1 -E '^Schermate:' | sed 's/^Schermate://' | tr -cd 'a-z0-9 -' || true)"
          fi
          schermate="$(printf '%s' "$schermate" | tr -cd 'a-z0-9 -')"
          echo "Serve il Mac: $serve · widget: $widget · schermate: ${schermate:-(giro predefinito)}"
          { echo "serve=$serve"; echo "widget=$widget"; echo "schermate=$schermate"; } >> "$GITHUB_OUTPUT"

  foto:
    needs: quando
    if: needs.quando.outputs.serve == 'true'
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Installa XcodeGen (se manca)
        run: command -v xcodegen > /dev/null || brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila l'app per il simulatore (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project Schieraxi.xcodeproj -scheme Schieraxi -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 \
            2>&1 | tee build-app.log | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/Schieraxi.app
      - name: Compila l'anteprima dei widget per il simulatore (senza firma)
        if: needs.quando.outputs.widget == 'true'
        run: |
          set +e
          xcodebuild -project Schieraxi.xcodeproj -scheme AnteprimaWidget -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 \
            > build-widget.log 2>&1 || { grep -E "error:" build-widget.log | sort -u | head -30; exit 1; }
          test -d build/Build/Products/Debug-iphonesimulator/AnteprimaWidget.app
      - name: Scatta le fotografie dell'app
        env:
          SCATTI: ${{ inputs.scatti || 'veloce' }}
          IPHONE: ${{ inputs.iphone == 'piccolo' && 'iphone-piccolo' || inputs.iphone == 'grande' && 'iphone-grande' || 'iphone' }}
          DISPOSITIVI: ${{ inputs.dispositivi || 'tutti' }}
          SCHERMATE: ${{ needs.quando.outputs.schermate }}
        run: bash scripts/screenshot.sh build/Build/Products/Debug-iphonesimulator/Schieraxi.app screenshot
      - name: Scatta le fotografie dei widget
        if: always() && needs.quando.outputs.widget == 'true' && inputs.dispositivi != 'ipad'
        run: bash scripts/screenshot_widget.sh build/Build/Products/Debug-iphonesimulator/AnteprimaWidget.app screenshot-widget
      - name: Carica le fotografie dell'app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: screenshot-app
          path: ios/screenshot/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Carica le fotografie dei widget
        if: always() && needs.quando.outputs.widget == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: screenshot-widget
          path: ios/screenshot-widget/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Log di compilazione (solo se qualcosa non va)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: log-foto
          path: |
            ios/build-app.log
            ios/build-widget.log
          retention-days: 7
          if-no-files-found: ignore
