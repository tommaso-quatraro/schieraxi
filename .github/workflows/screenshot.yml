name: Screenshot

# Fotografa l'app e i widget nel simulatore dei Mac di GitHub (issue #264):
# - l'app parte in modalità demo (-DEMO: dati finti, nessuna rete) e si fotografa su iPhone e iPad (chiaro e scuro, testo normale e grande);
# - l'anteprima dei widget (target AnteprimaWidget, dati finti, non entra nell'IPA) si fotografa in tutte le misure.
#   Nelle corse lunghe (scatti = completo o dispositivi = tutti) i widget vanno su un secondo Mac (job «widget») che parte
#   insieme all'app; nelle altre seguono l'app nello stesso job, sullo stesso simulatore già acceso (un Mac solo).
#   Circa 20 minuti: parte solo quando serve (ingresso «widget»: auto = nella corsa «completo», o se dall'ultima foto dei widget
#   dello stesso ramo sono cambiati i file che l'anteprima compila, FILE_WIDGET; se non si sa, parte; si = sempre; no = mai).
# Il Mac parte SOLO: a mano (Actions o `gh workflow run screenshot.yml --ref <ramo>`), oppure su una pull request che tocca ios/ e
# ha l'etichetta «screenshot» (`gh pr edit <N> --add-label screenshot`). Senza etichetta le PR non prenotano il Mac
# (i Mac gratuiti sono pochi e i test iOS hanno la precedenza).
# Le foto stanno negli artifact «screenshot-app» e «screenshot-widget» (14 giorni). Non crea release. Non blocca l'unione.
# «Fotografie dal vero» (scatti = vero, o etichetta «screenshot-vero» sulla PR): risposte vere del server con rose e nomi inventati
# (ios/fotografie/, vedi ios/Sources/Support/ScenarioVero.swift) in tre momenti della giornata, chiaro e scuro, testo grande
# sugli iPhone, orizzontale sull'iPad. Un solo Mac, un dispositivo dopo l'altro: dispositivi = iphone (predefinito: iPhone
# piccolo e grande), ipad, tutti. Artifact «screenshot-vero».
on:
  workflow_dispatch:
    inputs:
      scatti:
        description: "veloce = solo le schermate principali (pochi minuti); completo = tutte le varianti (quasi un'ora); vero = fotografie dal vero"
        type: choice
        options: [veloce, completo, collaudo, vero]
        default: veloce
      iphone:
        description: "quale iPhone: predefinito (Pro), piccolo (SE o il più stretto), grande (Pro Max)"
        type: choice
        options: [predefinito, piccolo, grande]
        default: predefinito
      dispositivi:
        description: "quali giri: iphone (predefinito, basta per le PR), ipad, tutti (solo per le PR che cambiano layout grandi)"
        type: choice
        options: [tutti, iphone, ipad]
        default: iphone
      schermate:
        description: "solo queste schermate (nomi separati da spazi, es. «lega-importa-csv scambi-una-rosa»), in tutte le varianti; vuoto = secondo «scatti»"
        type: string
        default: ""
      widget:
        description: "foto dei widget: auto = nella corsa completa o se sono cambiati i loro file; si = sempre; no = mai"
        type: choice
        options: [auto, si, no]
        default: auto
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths: ["ios/**", ".github/workflows/screenshot.yml"]

# Al massimo DUE corse di foto insieme in tutto il repository, in fila, e mai più di 5 job Mac (il limite del piano gratuito:
# oltre, i job aspettano e i test iOS restano dietro alle foto). Il job Linux «quando» aspetta che le corse Screenshot partite
# prima di questa, non ancora finite, siano meno di 2 (ordine del numero di corsa) e che i job Mac già IN CORSO nel
# repository (non quelli in coda), più quelli di questa corsa, non passino 5; poi lascia partire i Mac. Se non riesce a contarli
# aspetta. Dopo 45 minuti di fila parte comunque (con una riga nel registro): senza limite, i test iOS delle altre corse la
# tenevano ferma per ore (#403).
# La fila non usa i gruppi di concorrenza: GitHub ne terrebbe in attesa una sola e annullerebbe le altre.
# Gruppo di concorrenza della PR solo per le foto a ogni push (etichetta «screenshot»): un push nuovo annulla la corsa vecchia
# della stessa PR. Tutto il resto ha un gruppo suo (run_id) e non annulla né è annullato: corse a mano e su main, le foto dal
# vero (etichetta «screenshot-vero», partono solo quando si mette l'etichetta), le altre etichette, le PR senza «screenshot».
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && github.event.label.name == 'screenshot')
    || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'screenshot'))))
    && format('screenshot-pr-{0}', github.event.pull_request.number) || format('screenshot-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Gira su Linux (gratis e in pochi secondi): decide se serve il Mac, così le PR senza etichetta «screenshot» non lo prenotano.
  quando:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # l'attesa in fila sta qui (Linux, gratis); il massimo di GitHub è 360
    permissions:
      actions: read           # per vedere le corse e i job partiti prima, e l'ultima foto dei widget
      contents: read          # confronto dei commit (file cambiati)
      pull-requests: read     # file della PR
    outputs:
      serve: ${{ steps.decidi.outputs.serve }}
      widget: ${{ steps.widget.outputs.widget }}
      parallelo: ${{ steps.widget.outputs.parallelo }}
    steps:
      - name: Serve il Mac?
        id: decidi
        env:
          EVENTO: ${{ github.event_name }}
          AZIONE: ${{ github.event.action }}
          ETICHETTA_NUOVA: ${{ github.event.label.name }}
          ETICHETTE: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BOZZA: ${{ github.event.pull_request.draft }}
        run: |
          serve=false
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            serve=true
          elif [ "$EVENTO" = "pull_request" ] && [ "$BOZZA" = "true" ]; then
            echo "PR in bozza: niente Mac (le foto prima dell'unione si lanciano a mano: gh workflow run screenshot.yml --ref <ramo>)"
          elif [ "$EVENTO" = "pull_request" ]; then
            if [ "$AZIONE" = "labeled" ]; then
              # «screenshot-vero»: le fotografie dal vero, solo quando si mette l'etichetta (mai a ogni push)
              if [ "$ETICHETTA_NUOVA" = "screenshot" ] || [ "$ETICHETTA_NUOVA" = "screenshot-vero" ]; then serve=true; fi
            else
              case ",$ETICHETTE," in *,screenshot,*) serve=true ;; esac
            fi
          fi
          echo "Serve il Mac: $serve (evento: $EVENTO)"
          echo "serve=$serve" >> "$GITHUB_OUTPUT"
      - name: Servono le foto dei widget?
        id: widget
        if: steps.decidi.outputs.serve == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          RIF: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          SCATTI: ${{ inputs.scatti }}
          DISPOSITIVI: ${{ inputs.dispositivi }}
          RICHIESTA: ${{ inputs.widget }}
          ETICHETTA_NUOVA: ${{ github.event.label.name }}
          # i file che cambiano le foto dei widget: quelli che compila il target AnteprimaWidget (ios/project.yml), il progetto,
          # lo script delle foto dei widget e questo workflow (tests/test_workflow_foto.py controlla che l'elenco sia completo)
          FILE_WIDGET: '^(ios/(AnteprimaWidget/|WidgetSources/|project\.yml$|scripts/(screenshot_widget\.sh|scegli_simulatore\.py|avvisi\.sh)$|Sources/Domain/(Modelli|Quando|TempiLega|Formato|LinguaServer|ColoriSquadra|GeneratoreVolto)\.swift$|Sources/Support/(Condiviso|WidgetRiassunto|EventiPartita|AvatarVolto|LegaDemo)\.swift$|Sources/Support/Design/PercorsoSVG\.swift$)|\.github/workflows/screenshot\.yml$)'
        run: |
          widget=false
          if [ "$SCATTI" = vero ] || [ "$ETICHETTA_NUOVA" = screenshot-vero ] || [ "$DISPOSITIVI" = ipad ]; then
            perche="foto dal vero o solo iPad (come prima, niente widget)"
          elif [ "$RICHIESTA" = si ]; then
            widget=true; perche="chieste"
          elif [ "$RICHIESTA" = no ]; then
            perche="escluse a mano"
          elif [ "$SCATTI" = completo ]; then
            widget=true; perche="corsa completa"
          else
            # auto: solo se sono cambiati i file dei widget. Se non si sa, si fanno (meglio un Mac in più che un buco).
            if [ "$EVENTO" = pull_request ]; then
              file=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || file="ios/WidgetSources/"
            else
              # dall'ultima foto dei widget di questo ramo fatta da una corsa riuscita di questo repository (mai un fork con un
              # ramo dallo stesso nome, mai una corsa annullata o a metà); su un altro ramo senza foto, da main; su main senza: si fanno
              candidati=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=screenshot-widget&per_page=100" \
                --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == env.RIF and .workflow_run.head_repository_id == .workflow_run.repository_id) | "\(.workflow_run.id) \(.workflow_run.head_sha)"') || candidati=""
              base=""
              provate=0
              while read -r corsa sha; do
                if [ -z "$corsa" ] || [ "$provate" -ge 10 ]; then continue; fi
                provate=$((provate + 1))
                esito=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corsa" --jq '.conclusion') || esito=""
                if [ "$esito" = success ]; then base="$sha"; break; fi
              done <<< "$candidati"
              file="ios/WidgetSources/"
              if [ -z "$base" ] && [ "$RIF" != main ]; then base=main; fi
              if [ -n "$base" ]; then
                file=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$COMMIT" --jq '.files[].filename') || file="ios/WidgetSources/"
                if [ "$(printf '%s\n' "$file" | wc -l)" -ge 300 ]; then file="ios/WidgetSources/"; fi
              fi
            fi
            if printf '%s\n' "$file" | grep -qE "$FILE_WIDGET"; then
              widget=true; perche="cambiati i file dei widget (o non si sa)"
            else
              perche="file dei widget non cambiati"
            fi
          fi
          # Widget su un Mac a parte solo nelle corse lunghe (completo, tutti): in una corsa veloce misurata il secondo Mac
          # riaccendeva da zero il simulatore (8,9 min) e la corsa non si accorciava (PR #271). Altrimenti i widget seguono
          # l'app sullo stesso Mac e sullo stesso simulatore, già acceso.
          parallelo=false
          if [ "$widget" = true ] && { [ "$SCATTI" = completo ] || [ "$DISPOSITIVI" = tutti ]; }; then parallelo=true; fi
          # job Mac di questa corsa: app (o foto dal vero), widget a parte, controllo di accessibilità del collaudo
          mac=1
          if [ "$parallelo" = true ]; then mac=$((mac + 1)); fi
          if [ "$SCATTI" = collaudo ] && [ "$DISPOSITIVI" != ipad ]; then mac=$((mac + 1)); fi
          echo "Foto dei widget: $widget ($perche), su un Mac a parte: $parallelo. Mac per questa corsa: $mac"
          echo "widget=$widget" >> "$GITHUB_OUTPUT"
          echo "parallelo=$parallelo" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
      - name: In fila, al massimo 2 corse di foto e mai più di 5 job Mac
        if: steps.decidi.outputs.serve == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUESTA: ${{ github.run_id }}
          MAC: ${{ steps.widget.outputs.mac }}
        run: |
          POSTI=2
          MAC_TOTALI=5
          # Dopo 45 minuti in fila la corsa parte lo stesso (con una riga nel registro): non può aspettare per sempre, anche se
          # i test iOS delle altre corse occupano i Mac uno dopo l'altro. GitHub tiene comunque in ordine i job che aspettano un Mac.
          ATTESA_MASSIMA=2700
          inizio=$(date +%s)
          while :; do
            attendi=""
            if ! davanti=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/screenshot.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .id < $QUESTA) | .id] | .[]"); then
              attendi="l'elenco delle corse Screenshot non risponde"
            else
              prima=$(printf '%s\n' "$davanti" | grep -c . || true)
              if [ "$prima" -ge "$POSTI" ]; then
                attendi="in fila: $prima corse Screenshot prima di questa (posti: $POSTI)"
              else
                # I job Mac di una corsa esistono solo dopo il suo «quando»: finché una corsa di foto davanti non l'ha finito
                # i suoi Mac non si possono contare, e due corse partite quasi insieme arriverebbero a 6 job Mac.
                for corsa in $davanti; do
                  q=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corsa/jobs?per_page=100" \
                    --jq '[.jobs[] | select(.name == "quando" and .status != "completed")] | length') || q=""
                  if [ "$q" != 0 ]; then attendi="la corsa Screenshot $corsa davanti non ha ancora deciso i suoi Mac"; break; fi
                done
              fi
            fi
            if [ -z "$attendi" ]; then
              # job Mac IN CORSO nelle altre corse del repository (quelli in coda non contano: aspettano un Mac e GitHub li serve
              # in ordine; contarli faceva restare ferme le foto per ore dietro ai test iOS, #403); se una domanda fallisce si aspetta
              ok=true
              occupati=0
              corse=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" --jq '.workflow_runs[].id') || ok=false
              for corsa in $corse; do
                if [ "$ok" != true ] || [ "$corsa" = "$QUESTA" ]; then continue; fi
                n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corsa/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.status == "in_progress" and any(.labels[]; startswith("macos")))] | length') || n=""
                if printf '%s\n' "$n" | grep -qxE '[0-9]+'; then occupati=$((occupati + n)); else ok=false; fi
              done
              if [ "$ok" = true ] && [ $((occupati + MAC)) -le "$MAC_TOTALI" ]; then break; fi
              attendi="job Mac occupati: $occupati (conteggio riuscito: $ok), ne servono $MAC, al massimo $MAC_TOTALI"
            fi
            if [ $(( $(date +%s) - inizio )) -ge "$ATTESA_MASSIMA" ]; then
              echo "$(date -u +%H:%M) In fila da più di $((ATTESA_MASSIMA / 60)) minuti: la corsa parte lo stesso ($attendi)"
              break
            fi
            echo "$(date -u +%H:%M) $attendi"
            sleep 90
          done
          echo "Tocca a questa corsa"

  screenshot:
    needs: quando
    if: needs.quando.outputs.serve == 'true' && github.event.repository.private == false && inputs.scatti != 'vero' && github.event.label.name != 'screenshot-vero'
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa XcodeGen (se manca)
        run: command -v xcodegen > /dev/null || brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila l'app per il simulatore (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project Schieraxi.xcodeproj -scheme Schieraxi -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 \
            2>&1 | tee build-app.log | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/Schieraxi.app
      - name: Scatta le fotografie dell'app
        env:
          SCATTI: ${{ inputs.scatti || 'veloce' }}
          IPHONE: ${{ inputs.iphone == 'piccolo' && 'iphone-piccolo' || inputs.iphone == 'grande' && 'iphone-grande' || 'iphone' }}
          DISPOSITIVI: ${{ inputs.dispositivi || 'iphone' }}
          SCHERMATE: ${{ inputs.schermate || '' }}
        run: bash scripts/prova_avvisi.sh x screenshot
      # Widget nello stesso job, dopo l'app e sullo stesso simulatore già acceso: corse veloci e collaudo (uscite del job «quando»)
      - name: Compila l'anteprima dei widget per il simulatore (senza firma)
        if: ${{ !cancelled() && needs.quando.outputs.widget == 'true' && needs.quando.outputs.parallelo != 'true' }}
        run: |
          set +e
          xcodebuild -project Schieraxi.xcodeproj -scheme AnteprimaWidget -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 \
            > build-widget.log 2>&1 || { grep -E "error:" build-widget.log | sort -u | head -30; exit 1; }
          test -d build/Build/Products/Debug-iphonesimulator/AnteprimaWidget.app
      - name: Scatta le fotografie dei widget
        if: ${{ !cancelled() && needs.quando.outputs.widget == 'true' && needs.quando.outputs.parallelo != 'true' }}
        run: bash scripts/screenshot_widget.sh build/Build/Products/Debug-iphonesimulator/AnteprimaWidget.app screenshot-widget
      # i percorsi di upload-artifact partono dalla radice del repository, non da working-directory
      - name: Carica le fotografie dell'app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshot-app
          path: ios/screenshot/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Carica le fotografie dei widget
        if: ${{ !cancelled() && needs.quando.outputs.widget == 'true' && needs.quando.outputs.parallelo != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshot-widget
          path: ios/screenshot-widget/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Rapporti di crash (solo se qualcosa non va)
        if: failure()
        run: |
          mkdir -p crash
          cp ~/Library/Logs/DiagnosticReports/Schieraxi* ~/Library/Logs/DiagnosticReports/AnteprimaWidget* crash/ 2>/dev/null || true
          ls crash
      - name: Maschera i log (il repository è pubblico)
        if: failure()
        run: |
          for f in build-app.log build-widget.log; do
            [ -f "$f" ] && { python3 -I scripts/maschera_log.py "$f" "$f.mascherato" && mv "$f.mascherato" "$f" || rm -f "$f"; }
          done
          true
      - name: Carica i log in caso di problemi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: log-screenshot
          path: |
            ios/build-app.log
            ios/build-widget.log
            ios/crash/*
          retention-days: 7
          if-no-files-found: ignore

  # Le foto dei widget su un Mac a parte, insieme a quelle dell'app: solo nelle corse lunghe (completo, tutti) quando i widget
  # servono (uscita «parallelo» del job «quando»). Stessi artifact: «screenshot-widget», e «log-widget» se qualcosa non va.
  widget:
    needs: quando
    if: needs.quando.outputs.serve == 'true' && needs.quando.outputs.widget == 'true' && needs.quando.outputs.parallelo == 'true' && github.event.repository.private == false && inputs.scatti != 'vero' && github.event.label.name != 'screenshot-vero'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa XcodeGen (se manca)
        run: command -v xcodegen > /dev/null || brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila l'anteprima dei widget per il simulatore (senza firma)
        run: |
          set +e
          xcodebuild -project Schieraxi.xcodeproj -scheme AnteprimaWidget -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 \
            > build-widget.log 2>&1 || { grep -E "error:" build-widget.log | sort -u | head -30; exit 1; }
          test -d build/Build/Products/Debug-iphonesimulator/AnteprimaWidget.app
      - name: Scatta le fotografie dei widget
        run: bash scripts/screenshot_widget.sh build/Build/Products/Debug-iphonesimulator/AnteprimaWidget.app screenshot-widget
      - name: Carica le fotografie dei widget
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshot-widget
          path: ios/screenshot-widget/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Rapporti di crash (solo se qualcosa non va)
        if: failure()
        run: |
          mkdir -p crash
          cp ~/Library/Logs/DiagnosticReports/AnteprimaWidget* crash/ 2>/dev/null || true
          ls crash
      - name: Maschera il log (il repository è pubblico)
        if: failure()
        run: |
          [ -f build-widget.log ] && { python3 -I scripts/maschera_log.py build-widget.log build-widget.log.mascherato && mv build-widget.log.mascherato build-widget.log || rm -f build-widget.log; }
          true
      - name: Carica i log in caso di problemi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: log-widget
          path: |
            ios/build-widget.log
            ios/crash/*
          retention-days: 7
          if-no-files-found: ignore

  # Fotografie dal vero: un solo Mac, in fila come gli altri screenshot (job «quando»), un dispositivo dopo l'altro (scripts/screenshot.sh, SCATTI=vero).
  vero:
    needs: quando
    if: needs.quando.outputs.serve == 'true' && github.event.repository.private == false && (inputs.scatti == 'vero' || github.event.label.name == 'screenshot-vero')
    runs-on: macos-26
    timeout-minutes: 170
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa XcodeGen (se manca)
        run: command -v xcodegen > /dev/null || brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila l'app per il simulatore (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project Schieraxi.xcodeproj -scheme Schieraxi -configuration Debug             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build             build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64             2>&1 | tee build-app.log | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/Schieraxi.app
      - name: Scatta le fotografie dal vero
        env:
          SCATTI: vero
          FOTOGRAFIE: fotografie
          QUALI: ${{ inputs.dispositivi || 'iphone' }}
        run: |
          case "$QUALI" in
            ipad) giri="ipad" ;;
            tutti) giri="iphone-piccolo iphone-grande ipad" ;;
            *) giri="iphone-piccolo iphone-grande" ;;
          esac
          esito=0
          for d in $giri; do
            if [ "$d" = ipad ]; then
              DISPOSITIVI=ipad IPHONE=iphone bash scripts/screenshot.sh build/Build/Products/Debug-iphonesimulator/Schieraxi.app screenshot || esito=1
            else
              DISPOSITIVI=iphone IPHONE="$d" bash scripts/screenshot.sh build/Build/Products/Debug-iphonesimulator/Schieraxi.app screenshot || esito=1
            fi
          done
          exit $esito
      # i percorsi di upload-artifact partono dalla radice del repository, non da working-directory
      - name: Carica le fotografie
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshot-vero
          path: ios/screenshot/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Maschera il log (il repository è pubblico)
        if: failure()
        run: |
          [ -f build-app.log ] && { python3 -I scripts/maschera_log.py build-app.log build-app.log.mascherato && mv build-app.log.mascherato build-app.log || rm -f build-app.log; }
          true
      - name: Carica il log in caso di problemi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: log-vero
          path: ios/build-app.log
          retention-days: 7
          if-no-files-found: ignore

  # Solo nel collaudo (scatti = collaudo): il controllo automatico di accessibilità di Xcode su ogni schermata della demo.
  # Non fallisce per i problemi trovati: li elenca nel log (righe AUDIT|...) e nell'artifact «accessibilita».
  accessibilita:
    needs: quando
    if: needs.quando.outputs.serve == 'true' && inputs.scatti == 'collaudo' && inputs.dispositivi != 'ipad' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa XcodeGen (se manca)
        run: command -v xcodegen > /dev/null || brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Scegli e accendi il simulatore
        id: sim
        env:
          IPHONE: ${{ inputs.iphone == 'piccolo' && 'iphone-piccolo' || inputs.iphone == 'grande' && 'iphone-grande' || 'iphone' }}
        run: |
          IFS=$'\t' read -r UDID NOME IOS <<< "$(python3 -I scripts/scegli_simulatore.py "$IPHONE")"
          echo "Simulatore: $NOME ($IOS)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
      - name: Controllo di accessibilità
        env:
          TEST_RUNNER_AUDIT_ACCESSIBILITA: "1"
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          mkdir -p accessibilita
          xcodebuild test -project Schieraxi.xcodeproj -scheme Schieraxi \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build \
            -only-testing:SchieraxiUITests/AuditAccessibilitaUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            > accessibilita/test.log 2>&1
          echo "uscita di xcodebuild: $?"
          grep -E "^AUDIT" accessibilita/test.log | sort -u > accessibilita/problemi.txt
          echo "Problemi trovati: $(grep -c '^AUDIT|' accessibilita/problemi.txt)"
          grep -E "^AUDIT-FINE" accessibilita/problemi.txt
          grep -E "error:|\*\* TEST" accessibilita/test.log | head -20
          python3 -I scripts/maschera_log.py accessibilita/test.log accessibilita/test-mascherato.log && mv accessibilita/test-mascherato.log accessibilita/test.log || rm -f accessibilita/test.log
      - name: Carica i risultati
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: accessibilita
          path: ios/accessibilita/*
          retention-days: 14
          if-no-files-found: warn
