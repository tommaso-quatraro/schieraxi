name: Revisione IA

# Revisione automatica di ogni PR con Claude Code (anthropics/claude-code-action), chiamata dal job «revisione-ia» di test.yml:
# sta lì perché «unisci» possa aspettarla (needs vale solo dentro lo stesso workflow). Decisione e motivi:
# docs/decisioni/0007-revisione-ia-in-ci.md.
# - Le istruzioni sono la skill .claude/skills/revisione-pr/SKILL.md: l'azione rimette .claude/ come su main prima di avviare
#   Claude, quindi una PR non può riscriverle.
# - Il token di Claude (segreto CLAUDE_CODE_OAUTH_TOKEN) non arriva mai alle PR da fork né a quelle di Dependabot: il chiamante
#   esclude i fork, e senza segreto il job passa senza revisione (lo scrive nel riepilogo).
# - Claude ha solo strumenti di lettura e i commenti sulle righe: niente Write, Edit, Bash; la sintesi la pubblica il job. Permessi: contents read, pull-requests write.
# - Claude legge il codice della PR e basta: il diff lo prepara il job in .revisione-ia/ (niente gh, quindi niente conversazione
#   della PR), le letture restano nella cartella del checkout, e la sintesi passa da un filtro che toglie ciò che somiglia a un segreto.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  revisione:
    name: Revisione IA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write      # commenti sulle righe e sintesi; niente scritture sul codice
    concurrency:
      group: revisione-ia-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Un job solo, sempre eseguito: senza segreto i passi dopo si saltano e il job resta verde, così «unisci» non si blocca
      # prima che il segreto ci sia (o per le PR di Dependabot, che i segreti di Actions non li vedono).
      - name: C'è il token di Claude?
        id: segreto
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then presente=true; else presente=false; fi
          echo "presente=$presente" >> "$GITHUB_OUTPUT"
          if [ "$presente" = false ]; then
            echo "Segreto CLAUDE_CODE_OAUTH_TOKEN assente: revisione IA saltata" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.segreto.outputs.presente == 'true'
        with:
          fetch-depth: 2              # il commit di unione della PR e il suo primo genitore (main): servono al diff
          persist-credentials: false

      # Il diff della PR in file, prima di avviare Claude: così Claude non ha bisogno di gh (che leggerebbe anche commenti e
      # descrizioni della PR). La cartella si rifà da zero: una cartella con lo stesso nome portata dalla PR si butta.
      # Attributi di main (--attr-source) e --text: un .gitattributes della PR non può far sparire il codice dal diff.
      - name: Diff della PR
        if: steps.segreto.outputs.presente == 'true'
        run: |
          rm -rf .revisione-ia
          mkdir .revisione-ia
          git -c core.attributesFile=/dev/null --attr-source=HEAD^1 diff --no-color --no-ext-diff --no-textconv --text HEAD^1 HEAD > .revisione-ia/diff.patch
          git diff --name-status --no-color HEAD^1 HEAD > .revisione-ia/file.txt
          echo "Diff: $(wc -l < .revisione-ia/diff.patch) righe, $(wc -l < .revisione-ia/file.txt) file"

      # Versione fissata per commit (del 31/10/2026): fissa anche Claude Code (2.1.316, scritto nell'azione) e Bun (1.4.4).
      - name: Revisione con Claude Code
        id: claude
        if: steps.segreto.outputs.presente == 'true'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # token del job, permessi qui sopra: niente app di Claude, niente id-token
          show_full_output: "false"           # repository pubblico: i log li vede chiunque
          display_report: "false"
          prompt: |
            Repository: ${{ github.repository }}. Pull request numero ${{ github.event.pull_request.number }}.
            Il diff della pull request è in .revisione-ia/diff.patch, l'elenco dei file cambiati in .revisione-ia/file.txt.
            Segui la skill revisione-pr (.claude/skills/revisione-pr/SKILL.md) e rispondi con lo schema JSON richiesto.
          # Letture solo nel checkout (Read(./**) vale anche per Grep e Glob); i divieti valgono anche se un permesso li coprisse.
          claude_args: |
            --max-turns 30
            --allowedTools "Skill,Read(./**),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(//tmp/**),Read(//run/**),Read(//var/**),Read(//root/**),Read(//opt/**),Read(//home/runner/work/_temp/**),Read(//home/runner/work/_actions/**),Read(~/.claude/**),Read(~/.config/**),Read(~/.ssh/**),Read(~/.gitconfig),Read(./.git/**)"
            --json-schema '{"type":"object","properties":{"bloccanti":{"type":"integer","minimum":0},"sintesi":{"type":"string"}},"required":["bloccanti","sintesi"],"additionalProperties":false}'

      # Il cancello: rosso se Claude non ha dato l'esito (risposta vuota o non valida) o se ha trovato problemi bloccanti.
      # Scrive anche la sintesi in un file, che il passo dopo mette nella PR (Claude non ha «gh pr comment»).
      # L'esito si legge dal file dell'esecuzione scritto dall'azione: i valori di env: finiscono nel log pubblico del job,
      # e qui passa solo il percorso.
      - name: Cancello (nessun problema bloccante)
        if: steps.segreto.outputs.presente == 'true'
        env:
          ESECUZIONE: ${{ steps.claude.outputs.execution_file }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I -s - <<'FINE'
          import json, os, re, sys

          # Ciò che somiglia a un token o a un segreto non esce dalla sintesi (la PR e il riepilogo sono pubblici).
          SEGRETI = [
              r"sk-ant-[A-Za-z0-9_\-]{8,}",
              r"\bgh[pousr]_[A-Za-z0-9]{20,}",
              r"\bgithub_pat_[A-Za-z0-9_]{20,}",
              r"\bfw_[A-Za-z0-9_\-]{8,}",
              r"\bAKIA[0-9A-Z]{16}\b",
              r"\bxox[abprs]-[A-Za-z0-9\-]{10,}",
              r"\beyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+",
              r"-----BEGIN[A-Z ]*PRIVATE KEY-----[\s\S]*?(?:-----END[A-Z ]*PRIVATE KEY-----|\Z)",
              r"(?i)\b(?:bearer|basic)\s+[A-Za-z0-9._~+/=\-]{12,}",
          ]
          # nomi di variabili in maiuscolo (GITHUB_TOKEN=…): «Il token: controllato» resta com'è
          VARIABILE = re.compile(r"\b([A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|PASSWD|API_?KEY|PRIVATE_KEY)[A-Z0-9_]*)"
                                 r"(\s*[=:]\s*)['\"]?[^\s'\"`]{6,}['\"]?")
          LUNGO = re.compile(r"[A-Za-z0-9_\-+=]{32,}")

          def _casuale(m):
              parola = m.group(0)
              # commit di un'azione fissata (…@<40 cifre esadecimali>): resta
              if m.start() > 0 and m.string[m.start() - 1] == "@" and re.fullmatch(r"[0-9a-f]{40}", parola):
                  return False
              # stringa lunga con un tratto di sole lettere e cifre di almeno 20 caratteri, con lettere e cifre: un token
              tratto = max((len(t) for t in re.findall(r"[A-Za-z0-9]+", parola)), default=0)
              cifre = sum(c.isdigit() for c in parola)
              return tratto >= 20 and cifre >= 2 and len(parola) - cifre >= 2

          def ripulisci(testo):
              for schema in SEGRETI:
                  testo = re.sub(schema, "[tolto]", testo)
              testo = VARIABILE.sub(lambda m: m.group(1) + m.group(2) + "[tolto]", testo)
              return LUNGO.sub(lambda m: "[tolto]" if _casuale(m) else m.group(0), testo)

          def leggi_esito(percorso):
              # file dell'esecuzione dell'azione: elenco di messaggi, l'ultimo «result» porta structured_output.
              # None = esito mancante; ValueError = file rovinato.
              if not percorso or not os.path.isfile(percorso):
                  return None
              with open(percorso, encoding="utf-8") as f:
                  messaggi = json.load(f)
              if not isinstance(messaggi, list):
                  raise ValueError("file dell'esecuzione non valido")
              risultati = [m for m in messaggi if isinstance(m, dict) and m.get("type") == "result"]
              if not risultati or risultati[-1].get("structured_output") is None:
                  return None
              return risultati[-1]["structured_output"]

          def chiudi(testa, sintesi, errore=None):
              # «@» seguita da un carattere invisibile: la sintesi non chiama in causa nessuno su GitHub
              testo = ripulisci(testa + "\n\n" + sintesi).replace("@", "@\u2060").strip()
              commit = os.environ.get("COMMIT", "")[:7]
              with open(os.path.join(os.environ["RUNNER_TEMP"], "sintesi.md"), "w", encoding="utf-8") as f:
                  f.write("<!-- revisione-ia -->\n**Revisione automatica** (commit " + commit + ")\n\n" + testo + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## Revisione IA\n\n" + testo + "\n")
              sys.exit(errore)

          try:
              esito = leggi_esito(os.environ.get("ESECUZIONE", ""))
          except ValueError:
              chiudi("Esito non valido.", "Vedi il log del job «revisione-ia».", "File dell'esecuzione non valido")
          if esito is None:
              chiudi("Esito mancante.", "La revisione non ha dato l'esito: vedi il log del job «revisione-ia».",
                     "La revisione non ha restituito l'esito (structured_output vuoto)")
          try:
              bloccanti = esito["bloccanti"]
              sintesi = str(esito.get("sintesi", ""))
          except (ValueError, KeyError, TypeError):
              chiudi("Esito non valido.", "Vedi il log del job «revisione-ia».", "Esito della revisione non valido")
          if not isinstance(bloccanti, int) or isinstance(bloccanti, bool) or bloccanti < 0:
              chiudi("Esito non valido.", "Vedi il log del job «revisione-ia».",
                     "Esito della revisione non valido: «bloccanti» non è un numero intero")
          if bloccanti > 0:
              chiudi(f"Problemi bloccanti: {bloccanti}.", sintesi,
                     f"La revisione ha trovato {bloccanti} problemi bloccanti: vedi i commenti nella PR")
          chiudi("Nessun problema bloccante.", sintesi)
          FINE

      # Una sola sintesi per PR, aggiornata a ogni giro (commento del bot con il segno <!-- revisione-ia -->)
      - name: Sintesi nella PR
        if: ${{ !cancelled() && steps.segreto.outputs.presente == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          file="$RUNNER_TEMP/sintesi.md"
          [ -s "$file" ] || { echo "Nessuna sintesi da pubblicare"; exit 0; }
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- revisione-ia -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$file" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$file" > /dev/null
          fi
          echo "Sintesi pubblicata"
