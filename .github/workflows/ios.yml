name: iOS

# Test dell'app iOS nel simulatore di un Mac di GitHub. Nessuna firma, nessun segreto, nessun IPA pubblicato da qui.
# NOTA: adattato dal workflow del repository iOS di prima (cartella ios/); la prima volta va provato su GitHub.
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # i minuti macOS sono gratuiti solo sui repository pubblici: su un repository privato il job non parte
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Scegli il simulatore
        id: sim
        run: |
          IFS=$'\t' read -r UDID NOME IOS <<< "$(python3 -I scripts/scegli_simulatore.py iphone)"
          echo "Simulatore: $NOME ($IOS) $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
      - name: Compila ed esegui i test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -project Schieraxi.xcodeproj -scheme Schieraxi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/test.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build/test.log | tail -n 60
      - name: Righe con errori
        if: failure()
        run: grep -E "error:|Test Case .* failed|\*\* TEST FAILED|failed:" build/test.log | head -n 80 || true
