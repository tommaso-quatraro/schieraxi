name: Controlli

# Controlli del repository pubblico. Solo server di GitHub (ubuntu-latest, macos-26 per iOS): niente runner propri, niente segreti
# (solo GITHUB_TOKEN, più il token di Claude dato per nome al solo job revisione-ia), permessi di sola lettura salvo i job che scrivono (unisci, rilascia, prova-main, main-rosso), dichiarati nel job.
on:
  pull_request:
    # ready_for_review: quando una bozza diventa pronta i controlli ripartono (iOS compreso, saltato nelle bozze) e «unisci»
    # può unirla senza aspettare un altro push (prima di questo, #69 era rimasta ferma dopo `gh pr ready`)
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Lancio esplicito. Dopo ogni unione lo fa il job «prova-main» (le unioni e il commit di versione col token di GitHub non fanno
  # partire «push»: senza questo lancio nessun controllo girava mai sul nuovo main). Si può lanciare anche a mano:
  # Actions > Controlli > Run workflow, o `gh workflow run test.yml --ref main`. Su un ramo che non è main non apre issue.
  workflow_dispatch:

permissions:
  contents: read

# un nuovo push sulla stessa PR annulla i controlli in corso: l'unione non porta mai un commit non provato.
# Su main (push) nessuna corsa si annulla: ognuna ha un gruppo suo (run_id), perché in un gruppo GitHub tiene una sola corsa
# in attesa e annulla le altre in attesa anche con cancel-in-progress false.
concurrency:
  group: controlli-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"          # la stessa versione del server
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # prima dei test: pochi secondi, e se trova qualcosa non si aspetta tutta la suite
      - name: Controllo dei residui (nomi, indirizzi, segreti)
        run: python3 -I -s script/controlli/anti_residui.py --albero
      # ruff solo come CONTROLLO (regole in ruff.toml, niente riformattazione): pochi secondi, prima dei test. Ambiente a parte
      # (non entra nelle librerie dell'app), versione e hash fissati in .github/ruff-requisiti.txt, solo file binari.
      - name: Controllo del codice (ruff)
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/python" -m pip install -q --require-hashes --only-binary=:all: -r .github/ruff-requisiti.txt
          "$RUNNER_TEMP/ruff/bin/ruff" check --output-format=github fanta tests script prove
      - name: Installa le dipendenze
        run: python -m pip install -q -r requirements.txt -r requirements-dev.txt
      # pytest-xdist: un processo per CPU (4 sui runner dei repository pubblici). I test usano solo cartelle temporanee (conftest.py).
      - name: Test in parallelo
        run: python -m pytest -q -n auto --durations=10

  # Gli script del server (cartella script/server) si controllano qui: sintassi e fine riga
  script-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Script del server (sintassi e fine riga)
        run: |
          shopt -s nullglob
          for f in script/server/*.sh; do bash -n "$f"; done
          if grep -lU $'\r' script/server/*.sh; then echo "Fine riga di Windows negli script del server"; exit 1; fi

  # Sicurezza dei workflow con zizmor (https://docs.zizmor.sh): permessi troppo larghi, testo della PR dentro i comandi,
  # eventi pericolosi delle PR, azioni non fissate, credenziali lasciate al checkout, Dependabot. Il repository accetta solo
  # azioni di GitHub: zizmor si installa da PyPI, versione e hash fissati in .github/zizmor-requisiti.txt.
  # Per ora SEGNALA SOLTANTO: passo con continue-on-error e job fuori dai «needs» di «unisci»; i rilievi compaiono come
  # avvisi sui file della PR. Diventa bloccante quando è pulito (issue #108).
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa zizmor (versione e hash fissati)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/python" -m pip install -q --require-hashes --only-binary=:all: -r .github/zizmor-requisiti.txt
      - name: Sicurezza dei workflow (zizmor, per ora solo avvisi)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}     # controlli in linea (azioni con difetti noti, commit impostori): sola lettura
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --persona=regular --format=github --no-progress .'

  # Vulnerabilità note (database di PyPI e OSV) nelle librerie bloccate di requirements.txt e requirements-dev.txt, con pip-audit.
  # Non installa le librerie (--disable-pip: i file hanno già versioni fisse e hash). pip-audit e le sue dipendenze da PyPI con
  # versioni e hash fissati in .github/pip-audit-requisiti.txt. Job a sé, fuori dai «needs» di «unisci»: una vulnerabilità appena
  # pubblicata non blocca le PR che non c'entrano, ma il job diventa rosso e si vede; si corregge con una PR che aggiorna la libreria.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Installa pip-audit (versioni e hash fissati)
        run: |
          python3 -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install -q --require-hashes --only-binary=:all: -r .github/pip-audit-requisiti.txt
      - name: Vulnerabilità note nelle librerie
        run: '"$RUNNER_TEMP/pip-audit/bin/pip-audit" --disable-pip -r requirements.txt -r requirements-dev.txt --progress-spinner off'

  # La web in un browser vero (issue #619): i test di tests/browser/ in Chrome senza finestra, quello già installato sui server
  # di GitHub (nessun browser scaricato). La web si apre sul server finto di script/ci/server_finto.py (solo libreria standard)
  # con le risposte registrate delle tre fasi della giornata (ios/fotografie/, nomi inventati): niente server vero, niente
  # rete, nessun segreto. Gira nelle PR che toccano la web, i testi, i test del browser, axe, gli scenari, il server finto, il
  # suo ambiente o questo workflow (passo «Tocca la web?»: altrimenti i passi si saltano e il job resta verde in pochi
  # secondi); lanciato a mano su un ramo (`gh workflow run test.yml --ref <ramo>`) gira sempre; su main no. Playwright e
  # pytest in un ambiente a parte, versioni e hash fissati in .github/browser-requisiti.txt. BROWSER_OBBLIGATORIO=1: senza
  # Playwright o senza Chrome i test falliscono invece di saltare (qui un test saltato sarebbe un verde finto).
  # Guida: tests/browser/LEGGIMI.md.
  # BLOCCA L'UNIONE: «unisci» lo aspetta e lo vuole riuscito. Nelle PR il job non si salta mai (se la PR non tocca la web
  # salta solo i passi e resta verde), quindi una PR che non c'entra non resta ferma.
  browser:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2          # nelle PR il commit di prova e la sua base: git diff HEAD^1 HEAD = i file della PR
          persist-credentials: false
      - name: Tocca la web?
        id: decidi
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          serve=true
          if [ "$EVENTO" = pull_request ]; then
            # --no-renames: un file spostato conta col percorso vecchio e col nuovo (senza, git dice solo il nuovo)
            if ! git diff --name-only --no-renames HEAD^1 HEAD | grep -qE '^(fanta/web/|fanta/testi/|tests/browser/|tests/strumenti/axe/|ios/fotografie/|script/ci/server_finto\.py$|\.github/workflows/test\.yml$|\.github/browser-requisiti\.txt$)'; then
              serve=false
            fi
          fi
          echo "Test del browser: $serve"
          echo "serve=$serve" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.decidi.outputs.serve == 'true'
        with:
          python-version: "3.12"
      - name: Playwright e pytest (versioni e hash fissati)
        if: steps.decidi.outputs.serve == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/python" -m pip install -q --require-hashes --only-binary=:all: -r .github/browser-requisiti.txt
      - name: La web nel browser, nelle tre fasi della giornata
        if: steps.decidi.outputs.serve == 'true'
        env:
          BROWSER_OBBLIGATORIO: "1"
        run: '"$RUNNER_TEMP/browser/bin/python" -I -m pytest -q -p no:cacheprovider -m browser --confcutdir tests/browser tests/browser'

  # Contro il lavoro fuori piano: la descrizione della PR dichiara le aree («Aree: fanta/web, tests, docs») e i file cambiati
  # devono stare lì dentro (script/ci/controlla_ambito.py, preso da main). Esenti: PR dei bot e PR di soli documenti.
  # Poi i controlli della PR (script/ci/controlla_pr.py, preso da main): base main (niente rami impilati), sezioni della
  # descrizione, «## Revisione» fuori dalla bozza, in fanta/novita.d solo il file della PR, nessun test che legge una novità
  # per nome. Infine la dimensione: oltre 600 righe cambiate, senza test e file generati, un avviso (mai rosso).
  # BLOCCANTE: il job sta nei «needs» di «unisci». Gli script si prendono da main: un controllo nuovo vale dalla PR dopo la sua
  # unione, e se manca su main il passo lo dice e salta. La descrizione arriva solo come variabile d'ambiente.
  # Niente evento «edited» (scelta del 6/11): la revisione si scrive in bozza e «gh pr ready» rifà i controlli con la descrizione
  # nuova; con «edited» un ritocco del testo annullerebbe la corsa in corso. Descrizione corretta dopo: push, oppure
  # «gh pr ready --undo» e «gh pr ready» (un «Re-run» rilegge la descrizione di prima).
  ambito:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2          # il commit di prova della PR e la sua base: git diff HEAD^1 HEAD = i file della PR
          persist-credentials: false
      - name: Script di controllo presi da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: _ci-main
          sparse-checkout: script/ci
          persist-credentials: false
      - name: File della PR dentro le aree dichiarate
        env:
          AUTORE: ${{ github.event.pull_request.user.login }}
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f _ci-main/script/ci/controlla_ambito.py ]; then echo "::warning title=Ambito::controlla_ambito.py non è su main: controllo saltato"; exit 0; fi
          git diff --name-only HEAD^1 HEAD | python3 -I -s _ci-main/script/ci/controlla_ambito.py
      # anche se l'ambito è rosso: così si vedono tutti i problemi in una corsa sola
      - name: Descrizione, revisione, novità e test della PR
        if: ${{ !cancelled() }}
        env:
          AUTORE: ${{ github.event.pull_request.user.login }}
          CORPO: ${{ github.event.pull_request.body }}
          BOZZA: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ ! -f _ci-main/script/ci/controlla_pr.py ]; then echo "::warning title=Controlli della PR::controlla_pr.py non è su main: controllo saltato"; exit 0; fi
          git diff --name-status HEAD^1 HEAD | python3 -I -s _ci-main/script/ci/controlla_pr.py tests
      # Solo avviso: questo passo non diventa mai rosso (una PR grande si rivede male, ma a volte non si può dividere)
      - name: Dimensione della PR (solo avviso)
        if: ${{ !cancelled() }}
        run: |
          if ! grep -q -- "--dimensione" _ci-main/script/ci/controlla_ambito.py 2>/dev/null; then echo "::warning title=Dimensione::il controllo della dimensione non è ancora su main: saltato"; exit 0; fi
          git diff --numstat HEAD^1 HEAD | python3 -I -s _ci-main/script/ci/controlla_ambito.py --dimensione || echo "::warning title=Dimensione::controllo della dimensione non riuscito"

  # Ogni modifica al codice dell'app dice cosa cambia: un file fanta/novita.d/<nome>.json (il numero lo dà il bot all'unione)
  # Gli script di controllo si prendono da main, mai dal ramo della PR. Le PR di Dependabot non lo richiedono (e non si uniscono da sole).
  versione:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Script di controllo presi da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: _ci-main
          sparse-checkout: script/ci
          persist-credentials: false
      - name: Versione nuova con le sue novità
        env:
          BASE: ${{ github.base_ref }}
        run: python3 -I -s _ci-main/script/ci/controlla_versione.py "origin/$BASE"

  # La modifica tocca l'app iOS? Gira su Linux in pochi secondi: il Mac si prenota solo se serve.
  # «Tocca» vuol dire: ios/, ios.yml, o uno dei file fuori da ios/ che i test iOS leggono (elenco in ios/Tests/file-esterni.txt, #308).
  cambi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read       # elenco dei file della PR
      actions: read             # ultima corsa riuscita su main (corse lanciate dopo un'unione)
    outputs:
      ios: ${{ steps.decidi.outputs.ios }}
    steps:
      - name: Tocca ios/?
        id: decidi
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          RIF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          PRIMA: ${{ github.event.before }}
          DOPO: ${{ github.sha }}
        run: |
          # se l'API non risponde il job fallisce (bash -e) e «unisci» non parte: mai un'unione senza sapere se servivano i test iOS
          if [ "$EVENTO" = pull_request ]; then
            file=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          elif [ "$EVENTO" = workflow_dispatch ]; then
            # Corsa lanciata dopo un'unione (o a mano): non c'è «before». Su main si confronta con l'ultima corsa riuscita (push
            # o lancio): ogni corsa riuscita ha provato iOS oppure non ne aveva bisogno, quindi basta guardare cosa è cambiato
            # da allora. Su un ramo si confronta con main. Se non si sa (nessuna corsa riuscita, confronto impossibile,
            # troppi file) i test iOS girano comunque: meglio un Mac in più che un buco.
            if [ "$RIF" = refs/heads/main ]; then
              base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?branch=main&status=success&per_page=30" \
                --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // ""') || base=""
            else
              base=main
            fi
            file="ios/"
            if [ -n "$base" ]; then
              file=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$DOPO" --jq '.files[] | .filename, (.previous_filename // empty)') || file="ios/"
              if [ "$(printf '%s\n' "$file" | wc -l)" -ge 300 ]; then file="ios/"; fi
            fi
          elif [ -z "$PRIMA" ] || [ "$PRIMA" = 0000000000000000000000000000000000000000 ]; then
            file="ios/"
          else
            file=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PRIMA...$DOPO" --jq '.files[] | .filename, (.previous_filename // empty)')
          fi
          if printf '%s\n' "$file" | grep -qE '^(ios/|\.github/workflows/ios\.yml$)'; then
            ios=true
          else
            # Anche i file fuori da ios/ che i test iOS leggono (issue #308): stanno nell'elenco ios/Tests/file-esterni.txt.
            # Elenco illeggibile, vuoto o con una riga che non è un nome di file: i test girano (meglio un Mac in più che un buco).
            ios=true
            if elenco=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GITHUB_REPOSITORY/contents/ios/Tests/file-esterni.txt?ref=$DOPO"); then
              voci=$(printf '%s\n' "$elenco" | grep -vE '^[[:space:]]*(#|$)' || true)
              if [ -n "$voci" ] && ! printf '%s\n' "$voci" | grep -qvE '^[A-Za-z0-9_./-]+$'; then
                # Voce file: nome intero. Voce che finisce con «/» (cartella, issue #499): ogni file che comincia così.
                ios=false
                nomi=$(printf '%s\n' "$voci" | grep -v '/$' || true)
                cartelle=$(printf '%s\n' "$voci" | grep '/$' || true)
                if [ -n "$nomi" ] && printf '%s\n' "$file" | grep -qxF -f <(printf '%s\n' "$nomi"); then ios=true; fi
                if [ -n "$cartelle" ]; then
                  while IFS= read -r cartella; do
                    while IFS= read -r f; do
                      case "$f" in "$cartella"*) ios=true ;; esac       # tra virgolette: confronto letterale, mai un'espressione
                    done <<< "$file"
                  done <<< "$cartelle"
                fi
              fi
            fi
          fi
          echo "Tocca ios/: $ios"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  # Test dell'app iOS nel simulatore (macos-26), solo se la modifica tocca ios/. Sta qui (e non come workflow a parte)
  # perché «unisci» deve aspettarlo: prima una PR su ios/ si univa appena finivano i test Python.
  # Mai sulle PR in bozza (piano Free: pochi Mac insieme): parte quando la bozza diventa pronta (ready_for_review).
  # Una bozza non si unisce, quindi «unisci» non resta mai ad aspettare un «ios» saltato per la bozza.
  # Se lo stesso codice iOS è già verde in un'altra corsa (a mano sul ramo, o la PR prima dell'unione) il Mac non riparte
  # e il job risulta riuscito: lo decide il job Linux «gia-verde» di ios.yml (issue #264).
  ios:
    needs: cambi
    if: needs.cambi.outputs.ios == 'true' && !github.event.pull_request.draft
    permissions:
      contents: read
      actions: read             # «gia-verde» legge l'elenco degli artifact «ios-verde-…»
    uses: ./.github/workflows/ios.yml

  # Revisione con Claude Code (.github/workflows/revisione.yml): solo PR non in bozza, dal repository stesso (mai fork), non di bot.
  # Il segreto si passa per nome (niente «secrets: inherit»). Senza segreto il job passa senza revisione (docs/decisioni/0007).
  revisione-ia:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write      # commenti della revisione
    uses: ./.github/workflows/revisione.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Unione automatica (squash, ramo cancellato) solo per le PR del proprietario, non in bozza, con i controlli verdi
  # (iOS: verde, oppure saltato perché la PR non tocca ios/; revisione IA e ambito verdi). Mai per Dependabot e mai per le PR da fork.
  unisci:
    needs: [test, script-server, versione, cambi, ios, revisione-ia, ambito, browser]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.test.result == 'success' && needs.script-server.result == 'success' &&
      needs.versione.result == 'success' && needs.cambi.result == 'success' &&
      needs.revisione-ia.result == 'success' && needs.ambito.result == 'success' &&
      needs.browser.result == 'success' &&
      (needs.ios.result == 'success' || (needs.ios.result == 'skipped' && needs.cambi.outputs.ios == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # per cancellare il ramo e fare il commit di unione
      pull-requests: write     # per unire la PR
      issues: write            # per chiudere le issue di «Closes #N» (vedi sotto)
    steps:
      # Titolo e corpo del commit su main scritti qui (#620): il titolo della PR col numero, e nel corpo le righe di chiusura
      # della descrizione («Closes #N», anche Fixes e Resolves, «- Closes #N», «Closes: #N», in grassetto; a inizio riga, un
      # numero per riga) delle sole issue che GitHub collega alla PR (non quelle in un blocco di codice o in un commento), poi
      # le righe «Co-authored-by» dei commit. Senza, GitHub ci metteva tutta la descrizione, citazioni comprese. Il corpo non è
      # mai vuoto: un corpo vuoto potrebbe valere come «non dato» e riportare quello di GitHub.
      # Titolo, descrizione e issue collegate si leggono qui, subito prima dell'unione (la descrizione cambia anche dopo
      # «gh pr ready»): se la lettura non riesce il passo fallisce e non si unisce niente. I commit invece non sono un motivo
      # per fermarsi: senza, si unisce senza le righe «Co-authored-by» (con un avviso). I numeri vanno al passo dopo.
      - name: Unisci la PR (solo il commit che ha passato i test)
        id: unione
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTA: ${{ github.event.pull_request.head.sha }}
        run: |
          dati=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,closingIssuesReferences \
            --jq '.title, ([.closingIssuesReferences[] | select((.repository.owner.login + "/" + .repository.name) == env.GITHUB_REPOSITORY) | .number | tostring] | join(" ")), (.body // "")')
          titolo=$(printf '%s\n' "$dati" | sed -n 1p)
          if [ -z "$titolo" ]; then echo "::error title=Unione::gh pr view non ha dato il titolo della PR: non unisco"; exit 1; fi
          collegate=$(printf '%s\n' "$dati" | sed -n 2p)
          corpo=$(printf '%s\n' "$dati" | sed 1,2d | tr -d '\r')
          parole='(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)'
          dopo='[*_]{0,2}:?[*_]{0,2}[[:space:]]+[*_]{0,2}#([0-9]+)'
          candidate=$(printf '%s\n' "$corpo" | sed -nE 's/^ {0,3}([-*+][[:space:]]+)?[*_]{0,2}'"$parole$dopo"'([^0-9].*)?$/\2 #\3/Ip')
          righe=""
          numeri=""
          while IFS= read -r riga; do
            [ -n "$riga" ] || continue
            n=${riga##*#}
            case " $numeri " in *" $n "*) continue ;; esac
            case " $collegate " in
              *" $n "*) righe="$righe$riga"$'\n'; numeri="$numeri $n" ;;
              *) echo "::warning title=Unione::#$n sta in una riga di chiusura ma GitHub non la collega alla PR (blocco di codice, commento o altro repository, o non ancora collegata da GitHub: in quel caso chiudila a mano): non va nel commit e non si chiude" ;;
            esac
          done <<< "$candidate"
          for n in $(printf '%s\n' "$corpo" | grep -oiE "$parole$dopo" | grep -oE '[0-9]+$' | sort -un); do
            case " $(printf '%s\n' "$candidate" | grep -oE '[0-9]+$' | tr '\n' ' ') " in
              *" $n "*) ;;
              *) echo "::warning title=Unione::#$n compare con una parola di chiusura fuori da una riga di chiusura: non va nel commit e non si chiude" ;;
            esac
          done
          # gh pr view --json commits dà solo i primi 100 commit: oltre, le righe Co-authored-by dei successivi si perdono
          if messaggi=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[].messageBody'); then
            coautori=$(printf '%s\n' "$messaggi" | tr -d '\r' | grep -iE '^[[:space:]]*co-authored-by:[[:space:]]*[^[:space:]]' \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | awk '!visti[tolower($0)]++' || true)
          else
            coautori=""
            echo "::warning title=Unione::non riesco a leggere i commit della PR: il commit su main non avrà le righe Co-authored-by"
          fi
          righe=$(printf '%s' "$righe")
          testo=${righe:-Senza issue collegata.}
          if [ -n "$coautori" ]; then testo=$(printf '%s\n\n%s' "$testo" "$coautori"); fi
          echo "numeri=${numeri# }" >> "$GITHUB_OUTPUT"
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$TESTA" --subject="$titolo (#$PR)" \
            --body="$testo" --repo "$GITHUB_REPOSITORY"
      # Un'unione fatta con il token di GitHub Actions non chiude le issue di «Closes #N»: le chiude questo passo.
      # Solo issue di questo repository collegate dalla PR (closingIssuesReferences), e solo se sono ancora aperte; e tra
      # queste solo quelle delle righe «Closes #N» della descrizione (#620): un «closes #N» citato nel testo non chiude niente.
      - name: Chiudi le issue collegate alla PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RIGHE: ${{ steps.unione.outputs.numeri }}
        run: |
          numeri=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[] | select((.repository.owner.login + "/" + .repository.name) == env.GITHUB_REPOSITORY) | .number')
          for n in $numeri; do
            case " $RIGHE " in
              *" $n "*) ;;
              *) echo "::warning title=Chiusura delle issue::#$n è collegata alla PR ma non sta in una riga di chiusura della descrizione: resta aperta"; continue ;;
            esac
            stato=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$stato" = "OPEN" ]; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Fatta con la PR #$PR, unita su main."
            fi
          done

  # Dopo l'unione, uno alla volta: il numero di versione (commit del bot su main), la release vX.Y con --latest=false
  # (la «Latest» resta alla build iOS), e il lancio della build dell'IPA se ios/ è cambiata dall'ultima IPA riuscita.
  # L'unione e il commit del bot col GITHUB_TOKEN non fanno partire i workflow «on: push»: per questo ipa.yml si lancia qui
  # (workflow_dispatch è l'eccezione: col GITHUB_TOKEN parte).
  rilascia:
    needs: [unisci]
    # !cancelled(): senza, GitHub salta questo job quando un job a monte di «unisci» è saltato (il job «ios» nelle PR senza ios/)
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.unisci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rilascio-main
      cancel-in-progress: false
    permissions:
      contents: write          # commit del bot su main e release
      actions: write           # lancia ipa.yml (solo se ios/ è cambiata)
      pull-requests: read      # etichette delle PR delle novità in attesa (versione urgente, #635)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false      # repository pubblico: git fetch non ha bisogno del token; le scritture passano da gh
      - name: Numero di versione alle novità in attesa (commit del bot su main, creato e FIRMATO da GitHub via API)
        # Niente git push: il server installa solo commit firmati (script/server/verifica-firme.sh). Il commit fatto in locale
        # da assegna_versione.py lo ricrea GitHub (createCommitOnBranch, firmato con la sua chiave) solo se main e' ancora quello.
        # Se una PR delle novità in attesa ha l'etichetta P1 o urgente, il commit ha la riga «Rilascio: urgente» e il server la
        # installa subito invece di raggrupparla (#635). Tutte le PR in attesa, non solo questa: un «rilascia» in attesa può essere
        # scavalcato da quello della PR dopo, che dà il numero a tutte le novità.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > versioni.txt
          for tentativo in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            urgente=""
            for pr in $(python3 -I -s script/ci/assegna_versione.py --pr-in-attesa); do
              etichette=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name') \
                || { echo "::warning title=Rilascio::non leggo le etichette della PR #$pr: se era urgente, il server la installa con le altre"; continue; }
              if printf '%s\n' "$etichette" | grep -qxE 'P1|urgente'; then urgente=1; echo "PR #$pr urgente: versione segnata urgente"; fi
            done
            python3 -I -s script/ci/assegna_versione.py --commit ${urgente:+--urgente} > versioni.txt || exit 1
            [ -s versioni.txt ] || { echo "Nessuna novità in attesa"; exit 0; }
            python3 -I -s script/ci/commit_firmato.py origin/main HEAD > corpo.json || exit 1
            oid=$(gh api graphql --input corpo.json --jq '.data.createCommitOnBranch.commit.oid' 2>errore.txt) || oid=""
            if [ -n "$oid" ] && [ "$oid" != null ]; then
              git fetch -q origin main && git reset -q --hard "$oid"          # la release punta proprio al commit creato da GitHub
              echo "Versioni assegnate: $(tr '\n' ' ' < versioni.txt)(commit $oid)"; exit 0
            fi
            echo "main e' cambiato nel frattempo (o l'API ha risposto: $(head -c 300 errore.txt)): riprovo"; sleep $((tentativo * 5))
          done
          echo "Non sono riuscito a scrivere su main"; exit 1
      - name: Release delle versioni nuove (note = novità della versione, mai «Latest»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -s -c "import json; [print(v['versione']) for v in json.load(open('fanta/novita.json', encoding='utf-8'))[:10]]" > elenco.txt
          : > mancano.txt
          while read -r VER; do
            gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "$VER" >> mancano.txt
          done < elenco.txt
          for VER in $(tac mancano.txt); do
            python3 -I -s script/ci/note_rilascio.py "$VER" > note.md
            gh release create "v$VER" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Versione $VER" \
              --notes-file note.md --latest=false
          done
      - name: Build dell'IPA se ios/ è cambiata dall'ultima IPA riuscita
        # Si confronta con l'ultima IPA riuscita e non con i file di questa PR: se un «rilascia» in attesa viene scavalcato
        # da quello di una PR successiva (la concorrenza ne tiene in attesa uno solo), la modifica a ios/ non si perde.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ultima=$(gh run list --workflow ipa.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""' --repo "$GITHUB_REPOSITORY")
          if [ -z "$ultima" ] || ! git cat-file -e "$ultima^{commit}" 2>/dev/null \
             || ! git diff --quiet "$ultima" HEAD -- ios/ .github/workflows/ipa.yml; then
            gh workflow run ipa.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Build IPA lanciata (ultima IPA riuscita: ${ultima:-nessuna})"
          else
            echo "ios/ non è cambiata dall'ultima IPA ($ultima): niente IPA"
          fi

  # Dopo l'unione i controlli girano anche sul nuovo main (issue #183): l'unione e il commit di versione col token di GitHub non
  # fanno partire «push», quindi senza questo lancio due PR verdi ognuna da sola potevano rompere main insieme senza che nessuno
  # lo provasse. Si aspetta «rilascia» per provare il main finale (col commit di versione). workflow_dispatch è l'eccezione che
  # parte anche col token di GitHub (come per ipa.yml). La corsa lanciata è un workflow_dispatch: qui, in unisci e in rilascia
  # tutto è legato a pull_request, quindi non si ricomincia da capo. Non unisce e non rilascia nulla.
  prova-main:
    needs: [unisci, rilascia]
    # !cancelled(): «rilascia» può essere stato scavalcato da quello di una PR successiva; main si prova lo stesso
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.unisci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write           # solo per lanciare questo workflow su main
    steps:
      - name: Lancia i controlli su main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main --repo "$GITHUB_REPOSITORY"

  # Un rosso su main si vede senza cercarlo: un'issue P1 «CI: main rosso» (una sola, ogni nuovo rosso vi aggiunge un commento).
  # Solo nelle corse su main (push o lancio dopo l'unione), mai nelle PR né nei lanci a mano su un ramo. L'issue non si chiude
  # da sola: la chiude chi ha corretto, quando una corsa nuova su main è verde. Dentro i comandi solo dati nostri (esiti dei job,
  # commit, indirizzo della corsa) passati per variabili d'ambiente, mai testo di PR o issue.
  main-rosso:
    needs: [test, script-server, pip-audit, cambi, ios]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # uno alla volta: due corse rosse quasi insieme non aprono due issue uguali (la seconda trova la prima e la commenta)
    concurrency:
      group: main-rosso
      cancel-in-progress: false
    permissions:
      issues: write            # solo per aprire o commentare l'issue «CI: main rosso»
    steps:
      - name: "Apre o aggiorna l'issue «CI: main rosso»"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          ESITI: "test ${{ needs.test.result }}, script-server ${{ needs.script-server.result }}, pip-audit ${{ needs.pip-audit.result }}, ios ${{ needs.ios.result }}, cambi ${{ needs.cambi.result }}"
        run: |
          set -eu
          titolo="CI: main rosso"
          numero=$(gh issue list --state open --label P1 --limit 100 --json number,title \
            --jq "map(select(.title == \"$titolo\")) | first | .number // empty")
          testo="I controlli sul ramo main sono falliti. Commit: $COMMIT
          Esiti: $ESITI
          Corsa: $CORSA
          Cosa fare: aprire la corsa, guardare quale job è rosso e correggere con una pull request (main rotto ferma tutti). Se il job è fallito in pochi secondi senza passi è un guasto di GitHub: basta rilanciarlo ('Re-run failed jobs').
          L'issue non si chiude da sola: chiudila quando una corsa nuova su main è verde."
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body "Ancora rosso. $testo"
          else
            gh issue create --title "$titolo" --label P1 --label ci --label regressione --body "$testo"
          fi
