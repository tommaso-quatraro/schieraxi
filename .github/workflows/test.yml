name: Controlli

# Controlli del repository pubblico. Solo server di GitHub (ubuntu-latest): niente runner propri, niente segreti
# (solo GITHUB_TOKEN), permessi di sola lettura salvo i due job che scrivono (unisci, rilascia), dichiarati nel job.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# un nuovo push sulla stessa PR annulla i controlli in corso: l'unione non porta mai un commit non provato
concurrency:
  group: controlli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"          # la stessa versione del server
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Controllo dei residui (nomi, indirizzi, segreti)
        run: python3 -I -s script/controlli/anti_residui.py --albero

  # Gli script del server (cartella script/server, se c'è) si controllano qui: sintassi e fine riga
  script-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Script del server (sintassi e fine riga)
        run: |
          shopt -s nullglob
          for f in script/server/*.sh; do bash -n "$f"; done
          if grep -lU $'\r' script/server/*.sh; then echo "Fine riga di Windows negli script del server"; exit 1; fi

  # Ogni modifica al codice dell'app dice cosa cambia: un file fanta/novita.d/<nome>.json (il numero lo dà il bot all'unione)
  # Gli script di controllo si prendono da main, mai dal ramo della PR.
  versione:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Script di controllo presi da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: _ci-main
          sparse-checkout: script/ci
          persist-credentials: false
      - name: Versione nuova con le sue novità
        env:
          BASE: ${{ github.base_ref }}
        run: python3 -I -s _ci-main/script/ci/controlla_versione.py "origin/$BASE"

  # Unione automatica (squash, ramo cancellato) solo per le PR del proprietario, non in bozza, con i controlli verdi.
  # Mai per Dependabot e mai per le PR da fork (il token di una PR da fork non scrive).
  unisci:
    needs: [test, script-server, versione]
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # per cancellare il ramo e fare il commit di unione
      pull-requests: write     # per unire la PR
    steps:
      - name: Unisci la PR (solo il commit che ha passato i test)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$TESTA" --repo "$GITHUB_REPOSITORY"

  # Dopo l'unione, uno alla volta: il numero di versione (commit del bot su main), la release vX.Y con --latest=false
  # (la «Latest» resta alla build iOS), e il lancio della build dell'IPA se la PR ha toccato ios/.
  # Il commit del bot col GITHUB_TOKEN non fa partire i workflow «on: push»: per questo ipa.yml si lancia a mano qui.
  rilascia:
    needs: [unisci]
    if: github.event_name == 'pull_request' && needs.unisci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rilascio-main
      cancel-in-progress: false
    permissions:
      contents: write          # commit del bot su main e release
      actions: write           # lancia ipa.yml (solo se la PR ha toccato ios/)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Numero di versione alle novità in attesa (commit del bot su main, creato e FIRMATO da GitHub via API)
        # Niente git push: il server installa solo commit firmati (script/server/verifica-firme.sh). Il commit fatto in locale
        # da assegna_versione.py lo ricrea GitHub (createCommitOnBranch, firmato con la sua chiave) solo se main e' ancora quello.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > versioni.txt
          for tentativo in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -I -s script/ci/assegna_versione.py --commit > versioni.txt || exit 1
            [ -s versioni.txt ] || { echo "Nessuna novità in attesa"; exit 0; }
            python3 -I -s script/ci/commit_firmato.py origin/main HEAD > corpo.json || exit 1
            oid=$(gh api graphql --input corpo.json --jq '.data.createCommitOnBranch.commit.oid' 2>errore.txt) || oid=""
            if [ -n "$oid" ] && [ "$oid" != null ]; then
              git fetch -q origin main && git reset -q --hard "$oid"          # la release punta proprio al commit creato da GitHub
              echo "Versioni assegnate: $(tr '\n' ' ' < versioni.txt)(commit $oid)"; exit 0
            fi
            echo "main e' cambiato nel frattempo (o l'API ha risposto: $(head -c 300 errore.txt)): riprovo"; sleep $((tentativo * 5))
          done
          echo "Non sono riuscito a scrivere su main"; exit 1
      - name: Release delle versioni nuove (note = novità della versione, mai «Latest»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -s -c "import json; [print(v['versione']) for v in json.load(open('fanta/novita.json', encoding='utf-8'))[:10]]" > elenco.txt
          : > mancano.txt
          while read -r VER; do
            gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "$VER" >> mancano.txt
          done < elenco.txt
          for VER in $(tac mancano.txt); do
            python3 -I -s script/ci/note_rilascio.py "$VER" > note.md
            gh release create "v$VER" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Versione $VER" \
              --notes-file note.md --latest=false
          done
      - name: Build dell'IPA se la PR ha toccato ios/
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | grep -q '^ios/'; then
            gh workflow run ipa.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Build IPA lanciata"
          else
            echo "La PR non tocca ios/: niente IPA"
          fi
