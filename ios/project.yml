name: Schieraxi
options:
  bundleIdPrefix: it.tommaso
  deploymentTarget:
    # 18: Tab, zoom, MeshGradient, sidebarAdaptable. Le funzioni di iOS 26 (Liquid Glass) sono protette da #available con un ripiego.
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Schieraxi:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: SchieraxiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <vecchio identificativo>
        PRODUCT_NAME: Schieraxi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # icone alternative scelte in Lega > Icona dell'app (AppIcon-<colore> nell'asset catalog; il verde e' AppIcon)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-blu AppIcon-viola AppIcon-arancio AppIcon-rosso AppIcon-grafite"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SchieraXI
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # schermata di avvio senza storyboard: verde campo con il marchio fermo (4-3-3 e capitano)
        UILaunchScreen:
          UIColorName: FondoLancio
          UIImageName: MarchioLancio
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # schema schieraxi:// (per aprire l'app da una notifica ntfy con l'intestazione Click)
        CFBundleURLTypes:
          - CFBundleURLName: <vecchio identificativo>
            CFBundleURLSchemes:
              - schieraxi
        # aggiornamento in background (BGAppRefreshTask): identificativo permesso e modalità "fetch"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - <vecchio identificativo>.aggiorna
        # «Apri con SchieraXI» per i file delle rose (Excel, CSV, testo) da Files, Mail e dal menu Condividi: l'app ne riceve una copia
        CFBundleDocumentTypes:
          - CFBundleTypeName: File delle rose
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.spreadsheetml.sheet
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.plain-text
        LSSupportsOpeningDocumentsInPlace: false
  SchieraxiWidget:
    # estensione widget (WidgetKit): conto alla rovescia, modulo e punti attesi. Consuma un App ID in più con l'Apple ID gratuito.
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Sources/Domain/Modelli.swift
      - path: Sources/Domain/Quando.swift
      - path: Sources/Domain/Formato.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <vecchio identificativo>.widget
        PRODUCT_NAME: SchieraxiWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: SchieraXI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SchieraxiTests:
    # test automatici (XCTest) di Domain, Data e ViewModel: girano nel simulatore (workflow test.yml). Non entrano nell'IPA.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SchieraxiTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <vecchio identificativo>.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SchieraxiUITests:
    # test di fumo dell'interfaccia (XCUITest) con l'app in modalità -DEMO
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SchieraxiUITests
    dependencies:
      - target: Schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <vecchio identificativo>.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Schieraxi:
    # i test si costruiscono ed eseguono solo con "test": archive e build normali (ipa.yml, screenshot.yml) non li toccano
    build:
      targets:
        Schieraxi: all
        SchieraxiTests: [test]
        SchieraxiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SchieraxiTests
        - SchieraxiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
